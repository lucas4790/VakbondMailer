name: Bouwen en uitgeven

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # WPF en de Outlook-koppeling zijn Windows-only; dit project bouwt niet op een Linux-runner.
    runs-on: windows-latest

    permissions:
      contents: write # nodig om bij een v-tag de release aan te maken

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@v4

      - name: .NET 8 installeren
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Bouwen
        run: dotnet build --configuration Release

      - name: Tests draaien
        run: dotnet test --configuration Release --no-build

      - name: Uitgave samenstellen (.exe + handleiding + sjablonen)
        shell: pwsh
        run: |
          # Bij een tag heet de zip naar de versie, anders naar de commit.
          $naam = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          ./scripts/Maak-Uitgave.ps1 -ZipPath "dist/VakbondMailer-$naam.zip"

      - name: Zip bewaren bij deze build
        uses: actions/upload-artifact@v7
        with:
          name: VakbondMailer
          path: dist/VakbondMailer-*.zip
          if-no-files-found: error

      - name: Release publiceren
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "dist/VakbondMailer-$env:GITHUB_REF_NAME.zip" `
            --title "VakbondMailer $env:GITHUB_REF_NAME" `
            --notes-file .github/RELEASE_NOTES.md
